name: bourse_agricole
description: "Projet BAN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Utilisation de http pour communiquer avec l'API PawaPay
  http: ^1.2.0
  flutter_dotenv: ^6.0.1

  # --- LOCALISATION ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # --- UI ---
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0

  # --- BACKEND ---
  supabase_flutter: ^2.12.2
  go_router: ^17.2.1
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  barcode_widget: ^2.0.4

  # --- NOTIFICATIONS ---
  fluttertoast: ^9.1.0

  # --- URL LAUNCHER (PawaPay Payment Page) ---
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env